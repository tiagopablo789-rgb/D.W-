<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fashion Layout Ilustrativo</title>
    <!-- Importamos la fuente gruesa para igualar la tipografía -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="contenedor-principal">
        
        <!-- Barra de Navegación -->
        <nav class="navbar">
            <div class="logo">
                <span class="icono-f">F</span> FASHION
            </div>
            <ul class="enlaces">
                <li><a href="#">CATALOGUE</a></li>
                <li><a href="#">FASHION</a></li>
                <li><a href="#">FAVOURITE</a></li>
                <li><a href="#">LIFESTYLE</a></li>
                <li><a href="#" class="boton-signup">SIGN UP</a></li>
            </ul>
        </nav>

        <!-- Sección Central -->
        <section class="hero">
            <div class="texto-hero">
                <h1>
                    <!-- Recreamos los bloques de fondo detrás de cada palabra -->
                    <span class="bloque-blanco">LET'S</span><br>
                    <span class="bloque-blanco">EXPLORE</span><br>
                    <span class="bloque-amarillo">UNIQUE</span><br>
                    <span class="bloque-blanco">CLOTHES.</span>
                </h1>
                <p>Live for Influential and Innovative fashion!</p>
                <a href="#" class="boton-shop">Shop Now</a>
            </div>
            
            <div class="imagen-hero">
                <!-- Imagen de relleno temporal (puedes cambiar el link por tu propia foto recortada) -->
                <img src="https://images.unsplash.com/photo-1618932260643-eee4a2f652a6?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80" alt="Chica de moda">
                
                <!-- Estrellas decorativas de fondo -->
                <span class="estrella e1">★</span>
                <span class="estrella e2">★</span>
                <span class="estrella e3">★</span>
                <span class="estrella e4">★</span>
            </div>
        </section>

    </div>

    <!-- Franja Amarilla Inferior -->
    <div class="franja-marcas">
        <span class="marca">H&M</span>
        <span class="marca">OBEY</span>
        <span class="marca">amazon</span>
    </div>

</body>
</html>
